<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <link rel="stylesheet" href="styles.css">

    <title>Player de música</title>
</head>
<body>
    <div class="music-container" >
     <!-- sera criado no Javascript a playlist -->
      
    <h4 id="title-playlist">Player de musica</h4>

    <img id="cover" alt="Disc cover">

    <audio id="audio"></audio>
    </div>

    <div id="below-cover">
        <div id="song-info">
    <div id="name-music">Nome da música</div>
    <div id="name-band">Nome da banda </div>
        </div> 
        
    <button id="like" class="button"><i class="bi bi-suit-heart"></i></button>
   </div>

   <div id="progress-container"> 
      <div id="progress-bar">
        <div id="current-progress"></div>
    </div>
    <div id="time-box">
        <div id="song-time">00:00:00</div>
        <div id="total-time">00:00:00</div>
    </div>

   </div>

    <div id="button-container">

    <button id="shuffle" class="button"><i class="bi bi-shuffle"></i></button>

    <button id="previous" class="button button-navigate" ><i class="bi bi-skip-start-circle"></i></button>

    <button id="play" class="button button-biggest"
    ><i class="bi bi-play-circle-fill"></i></button>

    <button id="next" class="button button-navigate"><i class="bi bi-skip-end-circle"></i></button>

    <button id="repeat" class="button"><i class="bi bi-arrow-repeat"></i></button>
 </div>
</div>
 
<script src="script.js"></script>

</body>
</html>
